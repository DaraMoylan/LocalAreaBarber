<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalAreaBarber - Barber Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="dashboard-header">
    <h1>LocalAreaBarber</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <h2>Welcome, <span id="barber-name"></span></h2>


    <div class="tabs">
      <button id="services-tab" class="tab active" onclick="showTab('services')">My Services</button>
      <button id="add-tab" class="tab" onclick="showTab('add')">Add Service</button>
      <button id="bookings-tab" class="tab" onclick="showTab('bookings')">My Bookings</button>
    </div>

    <div id="services-panel" class="tab-panel">
      <div id="services-list"></div>
    </div>

    <div id="add-panel" class="tab-panel" style="display: none;">
      <input type="text" id="service-name" placeholder="Service name">
      <input type="number" id="service-duration" placeholder="Duration (minutes)">
      <input type="number" id="service-price" placeholder="Price (€)">
      <button onclick="addService()">Add Service</button>
    </div>

    <div id="bookings-panel" class="tab-panel" style="display: none;">
      <div id="bookings-list"></div>
    </div>

    <p id="message"></p>
  </div>

  <script src="/js/barber.js"></script>
</body>
</html>
